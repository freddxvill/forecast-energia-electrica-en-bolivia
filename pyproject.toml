[project]
name = "forecast-energia"
version = "0.1.0"
description = "Forecasting probabilístico de la demanda eléctrica del SIN de Bolivia con datos reales del CNDC."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "tenacity>=9",
    "holidays>=0.60",
    "scipy>=1.18.1",
]

[dependency-groups]
# `ml`: modelos livianos (CPU, sin torch): lo que usan el CI y el pronóstico diario.
ml = [
    "statsforecast>=2.0",
    "mlforecast>=1.0",
    "lightgbm>=4.5",
    "hierarchicalforecast>=1.0",
    "utilsforecast>=0.2",
]
# `neural`: NHITS/TFT. En Linux, torch sale del índice CPU de PyTorch (sin CUDA, ~200 MB).
neural = ["neuralforecast>=3.0", "torch>=2.4"]
models = [{ include-group = "ml" }, { include-group = "neural" }]
api = ["fastapi>=0.115", "uvicorn>=0.32"]
app = ["streamlit>=1.40", "plotly>=5.24"]
dev = [
    "pytest>=8.3",
    "httpx2>=2.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "nbstripout>=0.8",
    "ipykernel>=6.29",
    "poethepoet>=0.31",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_energia"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# En notebooks el `;` final suprime outputs a propósito y los gráficos tienen líneas largas.
"*.ipynb" = ["E501", "E703"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warning interno de pandas al importarse con numpy reciente (no es de este código).
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]

[tool.poe.tasks]
data = { cmd = "python -m forecast_energia.data.build", help = "Descarga (incremental) CNDC + clima y genera data/processed" }
refresh = { ref = "data", help = "Alias de data: solo baja los días nuevos y los últimos 3 días" }
data-offline = { cmd = "python -m forecast_energia.data.build --offline --sin-clima", help = "Reprocesa la caché sin red" }
test = { cmd = "pytest", help = "Corre los tests" }
lint = { cmd = "ruff check .", help = "Lint" }
fmt = { cmd = "ruff format .", help = "Formatea el código" }
backtest = { cmd = "python -m forecast_energia.pipelines.backtest", help = "Backtest local de los modelos (ver --help)" }
reporte = { cmd = "python -m forecast_energia.pipelines.backtest --solo-reporte", help = "Tabla de métricas desde artifacts/" }
intervalos = { cmd = "python -m forecast_energia.pipelines.intervalos", help = "Intervalos conformal + figuras desde artifacts/" }
jerarquia = { cmd = "python -m forecast_energia.pipelines.jerarquia", help = "Reconciliación SIN → departamentos + intervalos" }
impacto = { cmd = "python -m forecast_energia.pipelines.impacto", help = "KPIs de negocio vs PREV → reports/impacto.{json,md}" }
pronostico = { cmd = "python -m forecast_energia.pipelines.pronostico", help = "Pronóstico de mañana (producción) → artifacts/demo/" }
entrenar-tft = { cmd = "python -m forecast_energia.pipelines.pronostico --entrenar-tft", help = "Reentrena el TFT global y guarda el checkpoint" }
api = { cmd = "uvicorn forecast_energia.api.main:app --reload --port 8000", help = "API local (requiere --group api)" }
app = { cmd = "streamlit run app/streamlit_app.py", help = "Demo Streamlit local (requiere --group app)" }
kaggle-preparar = { cmd = "python kaggle/preparar.py", help = "Arma dataset + kernel GPU para Kaggle (--usuario <user>)" }
